<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>HeadUp · 颈颌线条协调度盲评</title><style>*{box-sizing:border-box}body{margin:0;background:#eef2ef;color:#17352d;font-family:"Segoe UI","Microsoft YaHei",sans-serif}button,select,textarea{font:inherit}main{width:min(1500px,calc(100% - 28px));margin:auto;padding:28px 0 50px}.hero{padding:24px 28px;border-radius:19px;background:#173d36;color:#fff}.eyebrow{font-size:10px;letter-spacing:.16em;color:#a9cbbf}.hero h1{margin:7px 0;font-size:clamp(26px,3vw,42px)}.hero p{max-width:980px;margin:0;color:#d3e5de;font-size:12px;line-height:1.75}.notice{margin:14px 0;padding:13px 15px;border:1px solid #d8b66d;border-radius:11px;background:#fff6de;font-size:12px;line-height:1.7}.toolbar{position:sticky;top:0;z-index:10;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:11px;margin-bottom:14px;border:1px solid #d4ded8;border-radius:13px;background:#f8faf9ed;backdrop-filter:blur(10px)}button{border:1px solid #b8c7c0;border-radius:8px;background:#fff;padding:8px 11px;cursor:pointer}.toolbar .export{margin-left:auto;background:#b77b2f;color:#fff;border-color:#b77b2f;font-weight:800}.toolbar .export:disabled{opacity:.4;cursor:not-allowed}.status{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.status span{padding:8px 11px;background:#fff;border-radius:8px;font-size:11px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.card{overflow:hidden;border:2px solid #d4ddd9;border-radius:14px;background:#fff}.card.rated{border-color:#5b987b}.photo{position:relative;aspect-ratio:1/1;background:#dce5e0}.photo img,.photo svg{position:absolute;inset:0;width:100%;height:100%}.photo img{object-fit:contain}.photo svg{pointer-events:none}.jaw{fill:none;stroke:#68dc9d;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}.neck{fill:none;stroke:#51c8c1;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}.body{padding:13px}.head{display:flex;justify-content:space-between;gap:8px}.head h2{margin:0;font-size:13px}.head span{font-size:9px;color:#77847d}.scores{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:12px 0}.score{padding:9px 3px;font-weight:800}.score.active{background:#173d36;color:#fff}.scale-labels{display:flex;justify-content:space-between;color:#78867f;font-size:9px}.fields{display:grid;gap:7px;margin-top:10px}.fields select,.fields textarea{width:100%;border:1px solid #c4d0ca;border-radius:8px;padding:8px;font-size:10px}.fields textarea{min-height:52px;resize:vertical}.tags{display:flex;gap:5px;flex-wrap:wrap}.tag{padding:6px 8px;font-size:9px}.tag.active{background:#dbeae2;border-color:#5f9278}.hidden{display:none!important}footer{padding-top:17px;color:#6f7d76;font-size:10px;line-height:1.7}@media(max-width:980px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.grid{grid-template-columns:1fr}.toolbar .export{margin-left:0}}</style></head><body><main><section class="hero"><div class="eyebrow">BLIND AESTHETIC RATING · ANGLE HIDDEN</div><h1>颈颌线条协调度盲评</h1><p>只依据照片中的下颌—颏部与颈线关系评分，页面不显示夹角、模型结果或参考带。评分用于检验角度是否真的关联视觉偏好，而不是反过来用角度暗示评分。</p></section><div class="notice"><strong>评分问题：</strong>“不考虑五官美丑，仅看下颌下缘、下巴与颈线之间的线条衔接，这张照片的视觉协调度如何？” 1=明显不协调，3=一般，5=很协调。遮挡或无法判断时选择低置信度并备注。</div><section class="toolbar"><button id="all" class="active">全部</button><button id="unreviewed">未评分</button><button id="toggle-lines">隐藏叠线</button><button id="import">导入进度</button><input id="import-file" type="file" accept="application/json" hidden/><button id="export" class="export" disabled>完成30张后导出JSON</button></section><div id="status" class="status"><span>正在加载30张…</span></div><section id="grid" class="grid"></section><footer>导出文件只包含匿名病例号、评分、信心和原因标签，不含照片、路径、坐标或角度。评分结果不能自动代表普遍审美；后续分析会单独检查样本量、评分分布与角度关联。</footer></main><script type="module" src="/research/profile-neck-aesthetic-rating.ts"></script></body></html>
