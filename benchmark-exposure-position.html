<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>HeadUp 过曝位置健壮性</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6f8;color:#142331;font-family:"Segoe UI","Microsoft YaHei",sans-serif}main{max-width:1260px;margin:auto;padding:28px}.hero{background:#40314b;color:#fff;border-radius:22px;padding:25px 30px}.hero h1{margin:0 0 8px}.hero p{color:#eadff0}.pills{display:flex;gap:10px;flex-wrap:wrap}.pill{background:#fff;color:#40314b;padding:9px 14px;border-radius:11px;font-weight:700}.panel{background:#fff;border-radius:18px;padding:20px;margin-top:18px}table{width:100%;border-collapse:collapse}th,td{text-align:left;border-bottom:1px solid #e6e1e9;padding:9px}.ok{color:#087f5b;font-weight:800}.bad{color:#c92a2a;font-weight:800}.note{background:#fff4d5;border:1px solid #ecd183;border-radius:14px;padding:13px 17px;margin-top:18px}pre{display:none}</style></head><body><main><section class="hero"><h1>HeadUp 过曝位置健壮性</h1><p id="status">准备中</p><div id="summary" class="pills"></div></section><section class="note"><strong>合同：</strong>102张真人正面以1.2×无黑边取景，分别保持中心或平移到左右上下10%；每个位置生成原图与200%强过曝。原图每位置至少95/102接受，强过曝每位置至少95/102明确命中，位置命中差不超过5张。</section><section class="panel"><h2>五位置结果</h2><table><thead><tr><th>位置</th><th>原图接受</th><th>原图过曝误报</th><th>200%过曝命中</th><th>200%接受</th></tr></thead><tbody id="rows"></tbody></table></section><section class="panel"><h2>预声明门</h2><table><tbody id="gates"></tbody></table></section><pre id="result"></pre></main><script type="module" src="/research/benchmark-exposure-position.ts"></script></body></html>
