<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>HeadUp 典型真人手工回归</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f3f6f8;color:#142331;font-family:"Segoe UI","Microsoft YaHei",sans-serif}main{max-width:1450px;margin:auto;padding:28px}.hero{background:#12354b;color:white;border-radius:22px;padding:25px 30px}.hero h1{margin:0 0 8px}.hero p{margin:5px 0;color:#dbe8ef}.stats,.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.pill,button,select,textarea{font:inherit}.pill{background:white;color:#17364b;padding:9px 14px;border-radius:12px;font-weight:700}.toolbar{background:white;border-radius:16px;padding:14px;margin:18px 0;align-items:center}.toolbar button,.action{border:1px solid #b9c8d0;background:#fff;border-radius:10px;padding:9px 13px;cursor:pointer}.toolbar button.active,.decision.active{background:#143d55;color:white;border-color:#143d55}.export{margin-left:auto!important;background:#087f5b!important;color:white!important;border-color:#087f5b!important}.notice{background:#fff4d5;border:1px solid #ecd384;border-radius:14px;padding:13px 17px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:white;border-radius:17px;overflow:hidden;border:2px solid #dbe4e8;box-shadow:0 5px 18px #14364b12}.card.reviewed{border-color:#7dccaa}.photo{height:300px;background:#dde5e9}.photo img{width:100%;height:100%;object-fit:cover}.body{padding:15px}.head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.head h2{font-size:16px;margin:0}.badge{font-size:12px;background:#edf2f4;padding:5px 8px;border-radius:8px}.defect-badge{background:#fff0ed;color:#9f2318}.defect-badge.resolved{background:#dff7ea;color:#087f5b}.quality{font-size:13px;line-height:1.6;color:#52636e;margin:10px 0}.decisions{display:flex;gap:6px}.decision{flex:1;border:1px solid #bdcbd2;background:#fff;border-radius:8px;padding:7px;cursor:pointer}.decision.fail.active{background:#b42318;border-color:#b42318}.decision.review.active{background:#a15c00;border-color:#a15c00}.fields{display:grid;gap:7px;margin-top:9px}.fields select,.fields textarea{width:100%;border:1px solid #c8d3d8;border-radius:8px;padding:8px}.fields textarea{min-height:58px;resize:vertical}.auto{margin-top:9px}.auto pre{white-space:pre-wrap;background:#f4f7f8;padding:8px;border-radius:8px;font-size:11px;max-height:180px;overflow:auto}.hidden{display:none!important}footer{color:#60717c;font-size:13px;padding:18px 2px}@media(max-width:950px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.grid{grid-template-columns:1fr}.export{margin-left:0!important}}</style></head><body><main>
<section class="hero"><h1>HeadUp 典型真人手工回归</h1><p id="status">加载中</p><div class="stats"><span class="pill">总样本 58</span><span class="pill">正面 30</span><span class="pill">左侧 10</span><span class="pill">右侧 10</span><span class="pill">质量边界 8</span><span id="progress" class="pill">已审核 0 / 58</span><span id="defectProgress" class="pill">人工缺陷加载中</span></div></section>
<section class="toolbar"><button data-filter="all" class="active">全部</button><button data-filter="front">正面</button><button data-filter="left_profile">左侧</button><button data-filter="right_profile">右侧</button><button data-filter="quality_boundary">质量边界</button><button data-filter="human_defect">人工缺陷</button><button data-filter="triage">差异优先</button><button data-filter="unreviewed">未审核</button><button id="runAll">运行全部当前门禁</button><button id="import">导入审核JSON</button><input id="importFile" type="file" accept="application/json,.json" hidden/><button id="export" class="export">导出匿名审核JSON</button></section>
<section class="notice"><strong>审核目标：</strong>核对质量提示、姿态方向、关键点/覆盖和测量是否符合肉眼预期。页面状态只保存在内存；导出不含图片、路径、哈希或人口属性。左侧图运行当前单侧生产门时应提示方向相反，可据此检查方向识别。</section>
<section id="grid" class="grid"></section><footer>图片来自现有本地授权研究库，本页不复制、不上传、不写浏览器存储。关闭或刷新页面会清空未导出的审核状态。</footer>
<script type="module" src="/research/manual-regression-review.ts"></script></main></body></html>
