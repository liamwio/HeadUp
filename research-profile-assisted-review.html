<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>HeadUp · 侧貌机器预标注人工复核</title><style>:root{font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#17251f;background:#f1f3ef}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}header,main{width:min(1420px,calc(100% - 30px));margin:auto}header{padding:28px 0 17px}.eyebrow{font-size:10px;font-weight:900;letter-spacing:.16em;color:#68776f}h1{margin:6px 0 9px;font:500 clamp(30px,4vw,48px)/1.15 "Songti SC",SimSun,serif}.lead{max-width:980px;margin:0;color:#637169;font-size:13px;line-height:1.7}.notice{margin:0 0 14px;padding:13px 16px;border:1px solid #d3b36f;background:#fff4d7;font-size:12px;line-height:1.7}.session{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-bottom:13px;padding:12px;border:1px solid #d4ddd7;background:#fff}.session input{padding:8px;border:1px solid #bdc8c1}.session a{margin-left:auto;color:#275f50;font-size:11px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:12px 0}.progress{font-size:12px;color:#5e6e66}.toolbar nav,.actions{display:flex;gap:7px;flex-wrap:wrap}button{min-height:38px;padding:0 12px;border:1px solid #abb8b0;border-radius:7px;background:#fff;color:#203a2e;cursor:pointer;font-size:11px;font-weight:800}button.primary{border-color:#173d36;background:#173d36;color:#fff}button.warn{border-color:#c99374;color:#8c4f34}button:disabled{opacity:.38;cursor:not-allowed}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:15px;align-items:start}.canvas-shell{position:relative;min-height:650px;max-height:82vh;overflow:auto;background:#101713}.stage{position:relative;display:inline-block;width:100%;min-width:540px;line-height:0}.stage img{display:block;width:100%}.stage svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}.model-line{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;opacity:.48}.model-line.active{stroke-width:5;opacity:.95}.review-point{stroke:#10271f;stroke-width:1.3;vector-effect:non-scaling-stroke;cursor:grab}.side{position:sticky;top:10px;padding:16px;border:1px solid #d5ddd7;background:#fff}.case-title{display:flex;justify-content:space-between;gap:8px;margin-bottom:11px}.case-title strong{font-size:15px}.case-title span{font-size:10px;color:#718078}.regions{display:grid;gap:7px}.region-button{display:flex;justify-content:space-between;width:100%;text-align:left}.region-button.active{background:#173d36;color:#fff}.region-button small{font-weight:500}.instruction{margin:13px 0;padding:11px;background:#edf2ed;color:#5b6a62;font-size:11px;line-height:1.6}.side textarea{width:100%;min-height:65px;margin-top:8px;padding:8px;border:1px solid #c7d0ca;resize:vertical;font-size:11px}.state{margin:10px 0;color:#5d6d65;font-size:10px;line-height:1.6;white-space:pre-line}.legend{display:flex;flex-wrap:wrap;gap:9px;margin-top:11px;color:#6b7a72;font-size:9px}.legend i{display:inline-block;width:14px;border-top:3px solid;margin-right:3px}.output{margin:16px 0 36px;padding:14px;background:#17251f;color:#deebe3;max-height:300px;overflow:auto;white-space:pre-wrap;font-size:10px}@media(max-width:920px){.workspace{grid-template-columns:1fr}.side{position:static}.canvas-shell{min-height:440px}}</style></head><body><header><div class="eyebrow">HEADUP · ASSISTED PROFILE REGION REVIEW</div><h1>侧貌机器预标注 → 人工核对与修正</h1><p class="lead">系统先生成30张照片的四区域轮廓。人工逐区域确认，或拖动点位修正；所有来源状态都会写入导出文件。本模式用于加速复核，不等同于A/B独立盲标人工真值。</p></header><main><div class="notice"><strong>重要：</strong>机器线不能直接成为canonical真值。只有显示“已确认 / 已修正 / 不可见”的区域才算完成人工复核；“待确认”不能进入发布结论。</div><section class="session"><label>恢复辅助审核 <input id="resume-file" type="file" accept="application/json"/></label><button id="resume">导入并继续</button><a href="/research-profile-region-annotation.html?session=A">返回A/B/C盲标真值页</a></section><div class="toolbar"><div id="progress" class="progress">正在加载机器预标注…</div><nav><label>病例 <select id="case-jump"></select></label><button id="previous">上一张</button><button id="next">下一张</button><button id="export" class="primary">导出辅助审核JSON</button></nav></div><section class="workspace"><div class="canvas-shell"><div id="stage" class="stage"><img id="photo" alt="侧貌机器预标注复核"/><svg id="overlay" viewBox="0 0 1 1" preserveAspectRatio="none"></svg></div></div><aside class="side"><div class="case-title"><strong id="case-title">准备模型…</strong><span id="case-index">0 / 30</span></div><div id="regions" class="regions"></div><div id="instruction" class="instruction">等待机器预标注。</div><div class="actions"><button id="confirm" class="primary">确认当前机器线</button><button id="reset">恢复机器线</button><button id="occluded" class="warn">标记不可见</button></div><textarea id="note" placeholder="可选备注：修正原因或遮挡位置"></textarea><p id="region-state" class="state">尚未生成。</p><div class="legend"><span><i style="border-color:#4baeea"></i>额部</span><span><i style="border-color:#e6ae2c"></i>鼻背</span><span><i style="border-color:#a76bd5"></i>上颌</span><span><i style="border-color:#36b873"></i>下颌—颏部</span></div></aside></section><pre id="output" class="output">等待模型。</pre></main><script type="module" src="/src/researchProfileAssistedReview.ts"></script></body></html>
