nd:#b42318}.decision.review.active{background:#9b5b00}.fields{display:grid;gap:8px;margin-top:9px}.fields select,.fields textarea{width:100%;border:1px solid #c5d1d7;border-radius:8px;padding:8px;font:inherit}.fields textarea{min-height:58px}.auto{margin-top:9px}.auto pre{white-space:pre-wrap;background:#f3f6f7;border-radius:8px;padding:8px;font-size:11px;max-height:180px;overflow:auto}.hidden{display:none!important}footer{padding:18px 2px;color:#667780;font-size:13px}@media(max-width:900px){.grid{grid-template-columns:1fr}}@media(max-width:580px){main{padding:14px}.visuals{grid-template-columns:1fr}.visual{min-height:220px}}</style></head><body><main><section class="hero"><h1>HeadUp 头顶轮廓手工审核</h1><p id="status">加载中</p><div class="stats"><span class="pill">典型案例 24</span><span class="pill">顶视深度＋人工轮廓</span><span id="progress" class="pill">已审核 0 / 24</span></div></section><section class="toolbar"><button data-filter="all" class="active">全部</button><button data-filter="zero">空场景</button><button data-filter="single">单头</button><button data-filter="multi">多头</button><button data-filter="border">贴边</button><button data-filter="unreviewed">未审核</button><button id="export" class="export">导出匿名审核JSON</button></section><section class="notice"><strong>审核目标：</strong>比较8位顶视深度与红色人工头部轮廓，检查头数、轮廓完整性、边界截断及多头粘连。此数据用于头顶轮廓研究，不代表手机RGB产品机位。</section><section id="grid" class="grid"></section><footer>TVHeads v1 · CC BY 4.0。仅保留24组深度/mask手测样本；完整1815组、16位深度和压缩包已删除。页面状态只在内存。</footer><script type="module" src="/research/manual-top-contour-review.ts"></script></main></body></html>
