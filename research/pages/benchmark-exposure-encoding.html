<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>HeadUp 高光编码尺寸回归</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6f8;color:#142331;font-family:"Segoe UI","Microsoft YaHei",sans-serif}main{max-width:1320px;margin:auto;padding:28px}.hero{background:#29434a;color:#fff;border-radius:22px;padding:25px 30px}.hero h1{margin:0 0 8px}.hero p{color:#dce9ec}.pills{display:flex;gap:10px;flex-wrap:wrap}.pill{background:#fff;color:#29434a;padding:9px 14px;border-radius:11px;font-weight:700}.panel{background:#fff;border-radius:18px;padding:20px;margin-top:18px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;border-bottom:1px solid #e3e9eb;padding:8px}.ok{color:#087f5b;font-weight:800}.bad{color:#c92a2a;font-weight:800}.note{background:#fff4d5;border:1px solid #ecd183;border-radius:14px;padding:13px 17px;margin-top:18px}pre{display:none}</style></head><body><main><section class="hero"><h1>HeadUp 高光编码尺寸回归</h1><p id="status">准备中</p><div id="summary" class="pills"></div></section><section class="note"><strong>合同：</strong>20张真人正面等距样本，在原图/200%强过曝、1080/720/512、PNG/JPEG95/JPEG75/WebP90组合下运行生产质量门。过曝标志必须逐图跨编码和尺寸一致；数值漂移只作次级约束。</section><section class="panel"><h2>组合汇总</h2><table><thead><tr><th>曝光</th><th>尺寸</th><th>编码</th><th>过曝命中</th><th>高光中位</th></tr></thead><tbody id="rows"></tbody></table></section><section class="panel"><h2>预声明门</h2><table><tbody id="gates"></tbody></table></section><pre id="result"></pre></main><script type="module" src="/research/benchmark-exposure-encoding.ts"></script></body></html>
