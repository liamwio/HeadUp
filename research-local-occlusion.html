<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#17251f" />
    <meta name="description" content="HeadUp 本地真实口罩与墨镜配对复测工具" />
    <link rel="icon" href="/favicon.svg" />
    <title>HeadUp · 本地真实遮挡配对复测</title>
    <style>
      :root { font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; color: #17251f; background: #f5f2e9; }
      * { box-sizing: border-box; }
      body { margin: 0; min-width: 320px; }
      button, input, select { font: inherit; }
      header, main { width: min(1120px, calc(100% - 32px)); margin-inline: auto; }
      header { padding: 42px 0 24px; }
      h1 { font-family: "Songti SC", SimSun, Georgia, serif; font-size: clamp(34px, 5vw, 56px); font-weight: 500; margin: 8px 0 14px; }
      h2, h3, p { margin-top: 0; }
      .eyebrow { color: #637169; font-size: 11px; font-weight: 700; letter-spacing: .15em; }
      .lead { max-width: 780px; color: #5f6d66; line-height: 1.8; }
      .notice { padding: 18px 20px; border: 1px solid #b8c7b8; background: #eaf1e8; line-height: 1.7; font-size: 13px; }
      .metadata { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin: 24px 0; }
      label { display: grid; gap: 8px; font-size: 12px; font-weight: 700; }
      select { min-height: 46px; border: 1px solid rgba(23,37,31,.18); background: #fbfaf6; padding: 0 12px; }
      .protocol { color: #5f6d66; font-size: 13px; line-height: 1.8; margin-bottom: 24px; }
      .condition-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
      .condition { background: #fbfaf6; border: 1px solid rgba(23,37,31,.14); padding: 18px; }
      .condition p { min-height: 46px; color: #68746e; font-size: 12px; line-height: 1.6; }
      .slot { border-top: 1px solid rgba(23,37,31,.11); padding: 14px 0; }
      .slot:first-of-type { border-top: 0; }
      .slot__row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
      .slot input { max-width: 190px; font-size: 11px; }
      .slot output { display: block; min-height: 34px; margin-top: 8px; color: #68746e; font-size: 11px; line-height: 1.55; }
      .pass { color: #2f6d48; }
      .reject { color: #a64f44; }
      .actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 28px 0 16px; }
      button { min-height: 48px; border: 0; border-radius: 5px; padding: 0 20px; cursor: pointer; font-weight: 700; }
      button:disabled { opacity: .45; cursor: not-allowed; }
      .primary { background: #17251f; color: white; }
      .secondary { border: 1px solid rgba(23,37,31,.22); background: transparent; }
      #summary { white-space: pre-wrap; overflow-wrap: anywhere; border: 1px solid rgba(23,37,31,.14); background: #fff; padding: 18px; min-height: 110px; font-size: 12px; line-height: 1.65; margin-bottom: 42px; }
      @media (max-width: 820px) {
        .condition-grid, .metadata { grid-template-columns: 1fr; }
        .condition p { min-height: auto; }
        .slot__row { align-items: stretch; flex-direction: column; }
        .slot input { width: 100%; max-width: 100%; }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="eyebrow">HEADUP · LOCAL RESEARCH TOOL</div>
      <h1>真实遮挡配对复测</h1>
      <p class="lead">在同一设备、同一位置和同一光线下，依次采集无遮挡、佩戴口罩、佩戴墨镜各 3 张正面照片。用于判断现有生产门禁能否稳定阻断真实遮挡。</p>
    </header>
    <main>
      <div class="notice"><strong>隐私边界：</strong>照片只在本页内存中分析，不上传、不写入浏览器存储。导出 JSON 不包含照片、文件名、哈希、人脸关键点或人口属性；刷新或关闭页面即可丢弃本次内存结果。</div>
      <div class="metadata">
        <label>设备类别
          <select id="device-class">
            <option value="smartphone_rear">手机后置相机</option>
            <option value="smartphone_front">手机前置相机</option>
            <option value="desktop_webcam">电脑摄像头</option>
            <option value="digital_camera">数码相机</option>
          </select>
        </label>
        <label>光线类别
          <select id="lighting">
            <option value="indirect_daylight">均匀间接日光</option>
            <option value="indoor_even">均匀室内灯光</option>
            <option value="mixed">混合光</option>
            <option value="other">其他</option>
          </select>
        </label>
      </div>
      <p class="protocol"><strong>拍摄协议：</strong>短边至少 1080 px；镜头与眼睛同高；脸部居中、直视镜头、自然闭口；三类条件之间不要移动设备、改变焦距或光线。每次选择照片后立即分析并释放文件引用。</p>
      <section id="condition-grid" class="condition-grid" aria-live="polite"></section>
      <div class="actions">
        <button id="export" class="primary" disabled>导出匿名聚合 JSON</button>
        <button id="reset" class="secondary">清空本次内存结果</button>
        <span id="progress">0 / 9 已完成</span>
      </div>
      <pre id="summary">完成 9 次分析后显示配对结论。</pre>
    </main>
    <script type="module" src="/src/researchLocalOcclusion.ts"></script>
  </body>
</html>
